name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install fonts
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Playwright downloads its own Chromium. The runner's unused Chrome APT
      # source can fail its index hash check and block Ubuntu dependency setup.
      - name: Disable the runner's Google Chrome APT source
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # The four gates. verify.py checks the shape of every Move file;
      # audit.py checks the content — undeclared tools, unguarded destructive
      # steps, unpinned installs, drifted service names, the dependency graph
      # and repeated prose. webcheck.py, below, opens the built site in a real
      # browser and asks the one question the other two cannot: after a reader
      # has scrolled a page, is anything on it still invisible? agree.py asks
      # whether the website, the printed interior and the README quote the
      # same numbers, which they have three times failed to. All four must be
      # clean.
      - name: Verify Move structure
        run: make verify

      - name: Audit Move content
        run: make audit

      # One invocation builds the interior and covers once, generates the EPUB
      # before the site copies it, and runs the browser and figure checks on
      # those same artefacts. Separate make calls rebuild phony prerequisites.
      - name: Build and check all artefacts
        run: make artefacts

      # upload-artifact only fails when none of its paths exist, so require
      # the hardcover separately before bundling the editions.
      - name: Check the hardcover cover is present
        run: test -s dist/cover-hardback.pdf

      # The site and the README's figures are generated from the sources.
      # Regenerating them must reproduce what was committed. The PDF and EPUB
      # are excluded: both carry a build timestamp and are not byte-reproducible.
      - name: Check the committed site and README are up to date
        run: |
          # --porcelain rather than `git diff`, because a diff only sees files
          # git already tracks: a new page nobody committed would generate here
          # and pass silently. This catches a modified file and an uncommitted
          # new one alike.
          CHANGED=$(git status --porcelain -- README.md site/ ':(exclude)site/*.pdf' ':(exclude)site/*.epub')
          if [ -n "$CHANGED" ]; then
            echo "::error::Generated site/ or README.md is out of date. Run 'make artefacts' and commit the result."
            echo "$CHANGED"
            exit 1
          fi
          echo "site/ and README.md match the sources."

      - name: Upload the built book
        uses: actions/upload-artifact@v4
        with:
          name: back-to-metal-pdf
          path: dist/Back-to-Metal.pdf
          if-no-files-found: error

      # The Amazon artefacts share the same sources and have their own gates:
      # kdpcheck.py on the interior, safe-area checks on both print covers, and
      # a structural check on the EPUB. The hardcover uses the dimensions
      # recorded from KDP's Cover Calculator; cover.py refuses to guess.
      - name: Upload the Amazon artefacts
        uses: actions/upload-artifact@v4
        with:
          name: amazon-editions
          path: |
            dist/cover-paperback.pdf
            dist/cover-hardback.pdf
            dist/cover-kindle.jpg
            dist/Back-to-Metal.epub
          if-no-files-found: error
